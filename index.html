<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABRIEL SOURCING - PDF Designer V4</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>*{font-family:Inter}</style>
</head>
<body class="bg-[#080808] text-white p-4">
<div class="max-w- mx-auto">
  <div class="bg-[#121212] rounded- p-7 border border-white/5">
    <h1 class="font-black text-">GERADOR <span class="text-[#CCFF00]">PDF V4</span></h1>
    <p class="text- text-white/40 mt-1">Foco total no designer do PDF - privado e premium</p>

    <div class="mt-6 space-y-3">
      <input id="cliente" placeholder="Cliente: Luís Felipe" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
      <div class="grid grid-cols-2 gap-3">
        <input id="pedido" value="GS-1023" class="h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
        <input id="peso" value="0,850kg" class="h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
      </div>
      <input id="produtos" value="1x Camisa Japão Edição Zoro - R$ 120" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
      <div class="grid grid-cols-2 gap-3">
        <select id="origem" class="h- rounded- bg-[#1E1E1E] border border-white/10 px-4"><option>Shenzhen, China</option><option>Bangkok, Tailândia</option><option>Shenzhen / Bangkok</option></select>
        <input id="lacre" value="1023" class="h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
      </div>
    </div>
    <button onclick="gerar()" class="w-full h- mt-6 rounded- bg-[#CCFF00] text-black font-black text-">GERAR PDF PREMIUM NOVO</button>
    <p class="text- text-white/20 text-center mt-3">WhatsApp +55 88 98895-2379 • Uso interno • Sem CNPJ • Sem Sugargoo</p>
  </div>
</div>

<script>
function gerar(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const cliente = document.getElementById('cliente').value || 'Luís Felipe';
  const pedido = document.getElementById('pedido').value || 'GS-1023';
  const peso = document.getElementById('peso').value || '0,850kg';
  const produto = document.getElementById('produtos').value || 'Camisa Japão';
  const origem = document.getElementById('origem').value;
  const lacre = document.getElementById('lacre').value;
  const data = new Date().toLocaleDateString('pt-BR');
  const auth = 'GS-'+Math.random().toString(36).substring(2,7).toUpperCase();

  // FUNDO
  doc.setFillColor(255,255,255);
  doc.rect(0,0,210,297,'F');

  // HEADER PREMIUM - não quadrado, com curva
  doc.setFillColor(10,10,10);
  doc.roundedRect(0,0,210,34,0,0,'F');
  doc.setFillColor(204,255,0);
  doc.rect(0,32,210,1.2,'F');

  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.setTextColor(204,255,0);
  doc.text('GABRIEL SOURCING', 14, 14);
  doc.setFontSize(7);
  doc.setTextColor(160,160,160);
  doc.setFont('helvetica','normal');
  doc.text('AGENTE DE COMPRAS INTERNACIONAL • HUB ASIA • VERIFICACAO PREMIUM', 14, 20);
  doc.setFontSize(8);
  doc.setTextColor(204,255,0);
  doc.setFont('helvetica','bold');
  doc.text('WhatsApp +55 88 98895-2379 | '+pedido+' | Lacre '+lacre, 14, 27);

  let y = 42;
  // TITULO COM BADGE ROUNDED
  doc.setFillColor(245,245,240);
  doc.roundedRect(14, y-6, 182, 16, 3, 3, 'F');
  doc.setTextColor(10,10,10);
  doc.setFontSize(11);
  doc.setFont('helvetica','bold');
  doc.text('CERTIFICADO PREMIUM DE PROCEDENCIA', 18, y);
  doc.setFontSize(6);
  doc.setFont('helvetica','normal');
  doc.setTextColor(100,100,100);
  doc.text('DOCUMENTO PRIVADO - USO INTERNO - NAO E DOCUMENTO FISCAL OFICIAL', 18, y+4);
  y+=14;

  doc.setFontSize(7);
  doc.setTextColor(80,80,80);
  doc.text('Codigo: GS-QC-'+pedido+' | Emissao: '+data+' | Auth: '+auth+' | Peso: '+peso, 14, y);
  y+=8;

  // CARD CLIENTE - ROUNDED
  doc.setFillColor(18,18,18);
  doc.roundedRect(14, y, 182, 18, 4, 4, 'F');
  doc.setTextColor(204,255,0);
  doc.setFontSize(8);
  doc.setFont('helvetica','bold');
  doc.text('CLIENTE', 18, y+5);
  doc.setTextColor(255,255,255);
  doc.setFontSize(9);
  doc.text(cliente+' • Pedido: '+pedido+' • Status: APROVADO', 18, y+11);
  y+=26;

  // OPERACAO
  doc.setTextColor(10,10,10);
  doc.setFontSize(8);
  doc.setFont('helvetica','bold');
  doc.text('DADOS DA OPERACAO', 14, y);
  y+=4;
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.text('Origem: '+origem+' | Centro: Hub de Qualidade Asia (Shenzhen & Bangkok)', 14, y); y+=4;
  doc.text('Modal: Aereo Expresso | Peso Conferido: '+peso+' | Lacre Inviolavel n '+lacre, 14, y); y+=8;

  // PRODUTO - TABELA PREMIUM ROUNDED
  doc.setFillColor(10,10,10);
  doc.roundedRect(14, y, 182, 8, 2, 2, 'F');
  doc.setTextColor(204,255,0);
  doc.setFontSize(7);
  doc.setFont('helvetica','bold');
  doc.text('PRODUTO', 18, y+5);
  y+=12;
  doc.setFillColor(250,250,245);
  doc.roundedRect(14, y-4, 182, 10, 2, 2, 'F');
  doc.setTextColor(20,20,20);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.text(produto, 18, y+1);
  y+=14;

  // LAUDO - COM ICONES
  doc.setFillColor(245,245,240);
  doc.roundedRect(14, y, 182, 36, 4, 4, 'F');
  doc.setTextColor(10,10,10);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.text('LAUDO TECNICO - DUPLO QC', 18, y+6);
  doc.setFont('helvetica','normal');
  doc.setFontSize(7);
  doc.text('✓ Inspecao na origem (fotos/videos reais) - APROVADO', 18, y+11);
  doc.text('✓ Reaberto e conferido no Brasil - APROVADO', 18, y+15);
  doc.text('✓ Costura, etiqueta, tamanho, embalagem premium - OK', 18, y+19);
  doc.text('✓ Lacre de seguranca n '+lacre+' aplicado - inviolavel', 18, y+23);
  doc.text('✓ Peso dimensional: '+peso+' - conferido', 18, y+27);
  y+=40;

  // STATUS VERDE NEON ROUNDED
  doc.setFillColor(204,255,0);
  doc.roundedRect(14, y, 182, 9, 3, 3, 'F');
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.text('STATUS FINAL: APROVADO E LIBERADO PARA ENTREGA', 18, y+6);
  y+=16;

  // AUTENTICACAO
  doc.setFillColor(10,10,10);
  doc.roundedRect(14, y, 110, 16, 3, 3, 'F');
  doc.setTextColor(204,255,0);
  doc.setFontSize(8);
  doc.text('VERIFICADO - GABRIEL SOURCING', 18, y+10);

  // QR FAKE PREMIUM
  doc.setDrawColor(200,200,200);
  doc.setLineDash([1,1],0);
  doc.roundedRect(150, y-2, 28, 28, 3, 3, 'S');
  doc.setLineDash([]);
  doc.setTextColor(100,100,100);
  doc.setFontSize(6);
  doc.setFont('helvetica','bold');
  doc.text('QR CODE', 158, y+10);
  doc.setFont('helvetica','normal');
  doc.text('Verificacao', 157, y+14);

  y+=38;
  doc.setTextColor(60,60,60);
  doc.setFontSize(7);
  doc.text('Auth: '+auth+' | Lacre: '+lacre+' | ID: '+pedido+' | '+data, 14, y);

  // FOOTER
  doc.setFontSize(5.5);
  doc.setTextColor(130,130,130);
  doc.text('Este documento e um comprovante privado de controle interno da Gabriel Sourcing. Nao substitui nota fiscal ou documento oficial.', 14, 285);
  doc.text('Contato: +55 88 98895-2379 | Hub Asia: Shenzhen/Bangkok > Curitiba | Uso exclusivo: '+cliente, 14, 288);
  doc.text('Gerado em '+new Date().toLocaleString('pt-BR'), 14, 291);

  doc.save('Certificado-PREMIUM-'+pedido+'-V4.pdf');
}
</script>
</body>
</html>
