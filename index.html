<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABRIEL SOURCING - Premium V3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,sans-serif}
.mono{font-family:JetBrains Mono,monospace}
body{background:#080808}
.card{background:rgba(18,18,18,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06)}
.input{width:100%;height:54px;background:#1E1E1E;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:0 16px;color:white;outline:none;transition:0.3s}
.input:focus{border-color:rgba(204,255,0,0.5);box-shadow:0 0 20px rgba(204,255,0,0.15)}
.select{appearance:none;background-image:url("data:image/svg+xml,[STRIPPED]);background-repeat:no-repeat;background-position:right 16px center}
</style>
</head>
<body class="text-white min-h-screen p-4 md:p-8">
<div class="max-w- mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded- bg-[#CCFF00] text-black grid place-items-center font-black text- shadow-[0_0_20px_rgba(204,255,0,0.4)]">G</div>
      <div><div class="font-black text- tracking-tight">GABRIEL SOURCING</div><div class="mono text- tracking-[0.14em] text-white/40">PREMIUM V3 • CONTROLE PRIVADO</div></div>
    </div>
    <div class="hidden md:block text-right"><div class="mono text- text-white/30">ATENDIMENTO</div><div class="mono text- font-bold text-[#CCFF00]">+55 88 98895-2379</div></div>
  </div>

  <div class="card rounded- overflow-hidden">
    <div class="h- w-full bg-gradient-to-r from-[#CCFF00] via-[#D4FF33] to-[#00FF88]"></div>
    <div class="p-7 md:p-8">
      <div class="flex items-center gap-3 mb-7">
        <div class="w-8 h-8 rounded-full bg-[#CCFF00]/15 border border-[#CCFF00]/30 grid place-items-center text-">📦</div>
        <div><h2 class="font-black text- leading-none">Dados para Emissão</h2><p class="mono text- text-white/40 mt-1">Sem CNPJ • Sem Sugargoo • Hub Ásia • Duplo QC</p></div>
      </div>

      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2"><label class="mono text- font-bold tracking-widest text-white/40">CLIENTE *</label><input id="cliente" class="input mt-2" placeholder="Ex: Luís Felipe"></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">ID DO PEDIDO</label><input id="pedido" class="input mt-2 mono font-bold" value="GS-1023"></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">DATA</label><input id="data" type="date" class="input mt-2"></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">PESO CONFERIDO</label><input id="peso" class="input mt-2" value="0,850kg"></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">LACRE Nº</label><input id="lacre" class="input mt-2 mono" value="1023"></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">ORIGEM 🌏</label><select id="origem" class="input select mt-2"><option>Shenzhen, China / Bangkok, Tailandia</option><option>Shenzhen, China - Galpão Oficial</option><option>Bangkok, Tailandia - Hub Premium</option><option>Yiwu, China - Mercado Central</option><option>Guangzhou, China</option></select></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">MODAL ✈️</label><select id="modal" class="input select mt-2"><option>Aéreo Expresso 12-18 dias - Premium</option><option>Aéreo Econômico 18-25 dias</option><option>Express 7-12 dias - VIP</option></select></div>
          <div class="md:col-span-2"><label class="mono text- font-bold tracking-widest text-white/40">PRODUTOS (um por linha)</label><textarea id="produtos" rows="4" class="w-full mt-2 rounded- bg-[#1E1E1E] border border-white/10 p-4 text- outline-none focus:border-[#CCFF00]/40" style="resize:none">1x Camisa Japão Edição Zoro - R$ 120
1x Bermuda Cargo - R$ 90</textarea></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">FRETE INT ¥</label><input id="freteInt" class="input mt-2" placeholder="Ex: 35"></div>
          <div><label class="mono text- font-bold tracking-widest text-white/40">FRETE BR R$</label><input id="freteBR" class="input mt-2" placeholder="Ex: 85"></div>
          <div class="md:col-span-2"><label class="mono text- font-bold tracking-widest text-white/40">OBSERVAÇÕES</label><input id="obs" class="input mt-2" placeholder="Ex: Embalagem reforçada solicitada"></div>
        </div>
      </div>

      <button onclick="gerar()" class="w-full h- mt-8 rounded- bg-[#CCFF00] text-black font-black text- tracking-[0.02em] shadow-[0_0_30px_rgba(204,255,0,0.35)] hover:shadow-[0_0_45px_rgba(204,255,0,0.55)] hover:translate-y-[-1px] transition-all">📄 GERAR CERTIFICADO PREMIUM • PDF</button>
      <div class="mt-4 text-center mono text- text-white/25">Documento privado • Não é fiscal oficial • WhatsApp +55 88 98895-2379</div>
    </div>
  </div>
</div>

<script>
document.getElementById('data').valueAsDate = new Date();
function gerar(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cliente = document.getElementById('cliente').value || 'Cliente';
  const pedido = document.getElementById('pedido').value || 'GS-1023';
  const data = document.getElementById('data').value? new Date(document.getElementById('data').value).toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');
  const peso = document.getElementById('peso').value;
  const lacre = document.getElementById('lacre').value;
  const origem = document.getElementById('origem').value;
  const modal = document.getElementById('modal').value;
  const produtos = document.getElementById('produtos').value;
  const freteInt = document.getElementById('freteInt').value || '--';
  const freteBR = document.getElementById('freteBR').value || '--';
  const obs = document.getElementById('obs').value;
  const WHATS = '+55 88 98895-2379';
  const auth = 'GS-AUTH-'+pedido+'-'+Math.random().toString(36).toUpperCase().slice(2,6);

  // HEADER BLACK PREMIUM
  doc.setFillColor(8,8,8); doc.rect(0,0,210,34,'F');
  doc.setFillColor(204,255,0); doc.rect(0,34,210,2,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(204,255,0); doc.text('GABRIEL SOURCING',14,15);
  doc.setFontSize(7); doc.setTextColor(170,170,170); doc.setFont('helvetica','normal'); doc.text('AGENTE INTERNACIONAL • HUB DE QUALIDADE - ASIA • CURITIBA > BRASIL • PREMIUM SERVICE',14,21);
  doc.setFontSize(8); doc.setTextColor(204,255,0); doc.setFont('helvetica','bold'); doc.text('WhatsApp '+WHATS+' | ID: '+pedido+' | Lacre: '+lacre+' | '+data,14,28);

  let y=42;
  doc.setTextColor(20,20,20); doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.text('CERTIFICADO PREMIUM DE PROCEDENCIA',14,y);
  y+=4; doc.setFontSize(6.5); doc.setFont('helvetica','normal'); doc.setTextColor(110,110,110);
  doc.text('COMPROVANTE PRIVADO DE CONTROLE INTERNO - GABRIEL SOURCING - NAO E DOCUMENTO FISCAL OFICIAL',14,y);
  y+=4; doc.setFontSize(7.5); doc.setTextColor(0,0,0);
  doc.text('Codigo: GS-QC-'+pedido+' | Emissao: '+data+' | Pedido: '+pedido+' | Lacre: '+lacre+' | Auth: '+auth,14,y);
  y+=3; doc.setDrawColor(220,220,220); doc.line(14,y,196,y); y+=7;

  function bloco(t){ doc.setFillColor(244,244,240); doc.roundedRect(14,y-4,182,9,2,2,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(0,0,0); doc.text(t,16,y+1); y+=8; }

  bloco('1. DESTINATARIO / CLIENTE');
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Cliente: '+cliente+' | Pedido: '+pedido+' | Status: APROVADO E LIBERADO',16,y); y+=5; doc.text('Data: '+data+' | Peso: '+peso,16,y); y+=8;

  bloco('2. OPERACAO INTERNACIONAL');
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text('Origem: '+origem,16,y); y+=4;
  doc.text('Hub: Hub de Qualidade - Asia (Shenzhen & Bangkok) | Modal: '+modal,16,y); y+=4;
  doc.text('Peso conferido: '+peso+' | Frete Interno: ¥ '+freteInt+' | Frete BR: R$ '+freteBR,16,y); y+=8;

  bloco('3. ITENS / PRODUTOS');
  doc.setFillColor(8,8,8); doc.rect(14,y-3,182,6,'F'); doc.setTextColor(204,255,0); doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.text('DESCRICAO DO PRODUTO',16,y+1); y+=5;
  doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(8);
  produtos.split('\n').forEach(l=>{ if(y>260){doc.addPage(); y=20;} doc.text('• '+l,16,y); y+=4; }); y+=4;

  bloco('4. LAUDO TECNICO DUPLO QC - CHINA + BRASIL');
  const checks=['[OK] Inspecao fisica na origem - fotos e videos reais conferidos','[OK] Inspecao fisica no Brasil - reaberto e conferido','[OK] Costura, estampa, etiqueta, tamanho 100% conforme','[OK] Embalagem premium + plastico bolha + caixa','[OK] Lacre de seguranca n '+lacre+' aplicado - inviolavel','[OK] Peso dimensional: '+peso+' conferido'];
  doc.setFontSize(7.5); checks.forEach(c=>{ doc.text(c,16,y); y+=4; }); y+=2;
  doc.setFillColor(204,255,0); doc.roundedRect(14,y-2,182,7,2,2,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text('STATUS FINAL: APROVADO - LIBERADO PARA ENTREGA',16,y+2.5); y+=10;

  bloco('5. AUTENTICACAO E RASTREIO');
  doc.setFillColor(8,8,8); doc.roundedRect(14,y,82,10,2,2,'F'); doc.setTextColor(204,255,0); doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.text('VERIFICADO - GABRIEL SOURCING',16,y+6.5); y+=14;
  doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.text('Auth: '+auth+' | Lacre: '+lacre+' | ID: '+pedido,16,y); y+=4;
  if(obs){ doc.text('Obs: '+obs,16,y); y+=4; }
  doc.setDrawColor(0,0,0); doc.rect(138,y-8,32,32); doc.setFontSize(6); doc.text('QR CODE',148,y+4); doc.text('Verificacao',146,y+8);

  doc.setFontSize(5.5); doc.setTextColor(110,110,110); doc.text('Documento privado de controle interno da Gabriel Sourcing. Nao substitui nota fiscal ou documento oficial.',14,290);
  doc.text('Contato: '+WHATS+' | Shenzhen/Bangkok > Curitiba | Gerado em '+new Date().toLocaleString('pt-BR'),14,293);
  doc.save('Certificado-Premium-'+pedido+'-'+cliente.replace(/\s+/g,'_')+'.pdf');
}
</script>
</body>
</html>
