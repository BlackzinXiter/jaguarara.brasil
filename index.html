<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABRIEL SOURCING - PDF V4 PREMIUM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
</head>
<body class="bg-[#080808] text-white p-4">
<div class="max-w- mx-auto">
<div class="bg-[#121212] border border-white/10 rounded- p-7">
<h1 class="font-black text-">GERADOR PDF V4 - FOCO NO DESIGNER</h1>
<p class="mono text- text-white/40 mt-1">Só o PDF importa - designer premium refeito</p>

<div class="mt-6 space-y-3">
<input id="cliente" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4" placeholder="Cliente ex: Luís Felipe" value="Luís Felipe">
<div class="grid grid-cols-2 gap-3">
<input id="pedido" class="h- rounded- bg-[#1E1E1E] border border-white/10 px-4 mono" value="GS-1023">
<input id="peso" class="h- rounded- bg-[#1E1E1E] border border-white/10 px-4" value="0,220g">
</div>
<input id="produto" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4" value="Camisa Japão Edição Zoro - R$ 120">
<select id="origem" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
<option>Shenzhen, China / Bangkok, Tailandia</option>
<option>Shenzhen, China</option>
<option>Yiwu, China</option>
<option>Bangkok, Tailandia</option>
</select>
<select id="modal" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4">
<option>Aéreo Expresso 12-18 dias</option>
<option>Aéreo Econômico 18-25 dias</option>
</select>
</div>

<button onclick="gerar()" class="w-full h- mt-6 rounded- bg-[#CCFF00] text-black font-black">GERAR PDF V4 PREMIUM</button>
<div class="mono text- text-white/30 text-center mt-3">WhatsApp +55 88 98895-2379 • Privado • Sem CNPJ</div>
</div>
</div>

<script>
function gerar(){
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
const cliente=document.getElementById('cliente').value||'Cliente';
const pedido=document.getElementById('pedido').value||'GS-1023';
const peso=document.getElementById('peso').value||'0,220g';
const produto=document.getElementById('produto').value||'Produto';
const origem=document.getElementById('origem').value;
const modal=document.getElementById('modal').value;
const hoje=new Date().toLocaleDateString('pt-BR');
const auth='GS-AUTH-'+pedido+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
const lacre='0001';

// FUNDO
doc.setFillColor(255,255,255); doc.rect(0,0,210,297,'F');

// HEADER PREMIUM - preto com linha neon arredondada
doc.setFillColor(10,10,10); doc.roundedRect(0,0,210,26,0,0,'F');
doc.setFillColor(204,255,0); doc.roundedRect(0,24,210,2.5,0,0,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(204,255,0);
doc.text('GABRIEL SOURCING',14,11);
doc.setFontSize(6.5); doc.setTextColor(150,150,150); doc.setFont('helvetica','normal');
doc.text('AGENTE DE COMPRAS INTERNACIONAL • HUB DE QUALIDADE • PREMIUM SERVICE',14,16.5);
doc.setFontSize(8); doc.setTextColor(204,255,0); doc.setFont('helvetica','bold');
doc.text('WhatsApp +55 88 98895-2379 | ID: '+pedido+' | Lacre: '+lacre,14,22);

let y=34;
// TITULO COM PILL
doc.setFillColor(245,246,240); doc.roundedRect(14, y, 182, 10, 3,3,'F');
doc.setFontSize(11); doc.setTextColor(10,10,10); doc.setFont('helvetica','bold');
doc.text('CERTIFICADO DE PROCEDENCIA E VERIFICACAO',16,y+6.5);
y+=13;
doc.setFontSize(6.2); doc.setTextColor(130,130,130); doc.setFont('helvetica','normal');
doc.text('DOCUMENTO PRIVADO DE USO INTERNO - GABRIEL SOURCING - NAO E DOCUMENTO FISCAL OFICIAL',14,y);
y+=3.5;
doc.setFontSize(7); doc.setTextColor(20,20,20);
doc.text('Codigo: GS-QC-'+pedido+' | Emissao: '+hoje+' | Auth: '+auth+' | Lacre: '+lacre,y);
y+=5;
doc.setDrawColor(230,230,225); doc.line(14,y,196,y); y+=8;

// 1 - CLIENTE - CARD ARREDONDADO
doc.setFillColor(248,248,245); doc.roundedRect(14,y,182,16,4,4,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(10,10,10);
doc.text('1. DESTINATARIO / CLIENTE',16,y+4.5);
doc.setFont('helvetica','normal'); doc.setFontSize(8);
doc.text('Cliente: '+cliente+' Pedido: '+pedido+' Data: '+hoje+' | Status: APROVADO E LIBERADO',16,y+10);
y+=22;

// 2 - OPERACAO
doc.setFillColor(248,248,245); doc.roundedRect(14,y,182,20,4,4,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.text('2. DADOS DA OPERACAO INTERNACIONAL',16,y+4.5);
doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(50,50,50);
doc.text('Origem: '+origem,16,y+9.5);
doc.text('Hub: Hub de Qualidade - Asia (Shenzhen & Bangkok) | Modal: '+modal,16,y+14);
y+=26;

// 3 - PRODUTOS - TABELA PREMIUM
doc.setFillColor(248,248,245); doc.roundedRect(14,y,182,7,4,4,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(10,10,10);
doc.text('3. PRODUTOS / ITENS VERIFICADOS',16,y+4.8); y+=10;
doc.setFillColor(10,10,10); doc.roundedRect(14,y,182,7,2,2,'F');
doc.setTextColor(204,255,0); doc.setFontSize(6.5);
doc.text('QTD / PRODUTO',16,y+4.5); doc.text('VALOR',150,y+4.5); y+=10;
doc.setFillColor(255,255,255); doc.roundedRect(14,y,182,9,2,2,'F');
doc.setDrawColor(240,240,235); doc.roundedRect(14,y,182,9,2,2,'D');
doc.setTextColor(20,20,20); doc.setFont('helvetica','normal'); doc.setFontSize(8);
doc.text(produto,16,y+5.5); y+=14;

// 4 - LAUDO - CARDS
doc.setFillColor(248,248,245); doc.roundedRect(14,y,182,7,4,4,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.text('4. LAUDO TECNICO - DUPLO QC (CHINA + BRASIL)',16,y+4.8); y+=11;
doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(40,40,40);
const checks=[
'✓ Inspecao fisica na origem (China/Tailandia) - fotos e videos reais conferidos',
'✓ Inspecao fisica no Brasil - pacote reaberto e conferido item a item',
'✓ Costura, estampa, etiqueta, tamanho e acabamento 100% conforme',
'✓ Embalagem premium + plastico bolha + caixa reforçada',
'✓ Lacre de seguranca n '+lacre+' aplicado - inviolavel | Peso: '+peso
];
checks.forEach(c=>{ doc.text(c,16,y); y+=4.2; });
y+=4;
doc.setFillColor(204,255,0); doc.roundedRect(14,y,182,8,3,3,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(0,0,0);
doc.text('STATUS FINAL: APROVADO - LIBERADO PARA ENTREGA',16,y+5.2); y+=14;

// 5 - AUTENTICACAO - DESIGN NOVO
doc.setFillColor(248,248,245); doc.roundedRect(14,y,182,7,4,4,'F');
doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.text('5. AUTENTICACAO INTERNA',16,y+4.8); y+=11;
doc.setFillColor(10,10,10); doc.roundedRect(14,y,86,13,3,3,'F');
doc.setTextColor(204,255,0); doc.setFontSize(8.5); doc.text('VERIFICADO - GABRIEL SOURCING',16,y+8);
y+=18;
doc.setTextColor(30,30,30); doc.setFont('helvetica','normal'); doc.setFontSize(7);
doc.text('Codigo Auth: '+auth+' | Lacre: '+lacre+' | ID: '+pedido+' | Emissao: '+hoje,16,y);
y+=5;
// QR CODE - quadrado com borda tracejada arredondada
doc.setDrawColor(10,10,10); doc.setLineWidth(0.3); doc.roundedRect(145,y-12,32,32,3,3,'D');
doc.setFontSize(6); doc.setTextColor(80,80,80);
doc.text('QR CODE',154,y-1); doc.text('Verificacao',152,y+3);
doc.setLineWidth(0.1);

y=270;
doc.setFontSize(5.5); doc.setTextColor(120,120,120);
doc.text('Este documento e um comprovante privado de controle interno da Gabriel Sourcing. Nao substitui nota fiscal, DI ou documentos oficiais.',14,y);
doc.text('Contato: +55 88 98895-2379 - Hub Asia - Shenzhen / Bangkok > Curitiba | Gerado em '+new Date().toLocaleString('pt-BR')+' - Exclusivo '+cliente,14,y+3.5);

doc.save('Certificado-PREMIUM-V4-'+pedido+'.pdf');
}
</script>
</body>
</html>
