<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABRIEL SOURCING - Gerador de Certificado</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
</head>
<body class="bg-[#080808] text-white min-h-screen p-4 md:p-8">
<div class="max-w- mx-auto">
  <div class="flex items-center gap-3 mb-8">
    <div class="w-10 h-10 rounded- bg-[#CCFF00] text-black grid place-items-center font-black">G</div>
    <div><div class="font-black text-">GABRIEL SOURCING</div><div class="text- tracking-widest text-white/40 mono">GERADOR DE CERTIFICADO - USO INTERNO</div></div>
  </div>

  <div class="bg-[#121212] border-2 border-[#CCFF00]/20 rounded- p-6">
    <div class="text- font-black tracking-widest text-[#CCFF00] mb-4">DADOS DO PEDIDO</div>

    <div class="space-y-4">
      <div><div class="text- text-white/40 font-bold mb-1">CLIENTE</div><input id="cliente" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 text-white outline-none focus:border-[#CCFF00]" placeholder="Ex: João Silva"></div>
      <div><div class="text- text-white/40 font-bold mb-1">PRODUTO</div><input id="produto" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 text-white outline-none focus:border-[#CCFF00]" placeholder="Ex: Camisa Louis Vuitton"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><div class="text- text-white/40 font-bold mb-1">ID DO PEDIDO</div><input id="id" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 text-white outline-none focus:border-[#CCFF00]" value="GS-1023"></div>
        <div><div class="text- text-white/40 font-bold mb-1">PESO</div><input id="peso" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 text-white outline-none focus:border-[#CCFF00]" value="0,850kg"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><div class="text- text-white/40 font-bold mb-1">VALOR</div><input id="valor" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 text-white outline-none focus:border-[#CCFF00]" value="R$ 180,00"></div>
        <div><div class="text- text-white/40 font-bold mb-1">LACRE Nº</div><input id="lacre" class="w-full h- rounded- bg-[#1E1E1E] border border-white/10 px-4 text-white outline-none focus:border-[#CCFF00]" value="1023"></div>
      </div>
    </div>

    <button onclick="gerarPDF()" class="w-full h- mt-6 rounded- bg-[#CCFF00] text-black font-black text- shadow-[0_0_20px_rgba(204,255,0,0.3)]">📄 GERAR CERTIFICADO PDF</button>
    <div class="text- text-white/30 text-center mt-3 mono">WhatsApp +55 88 98895-2379 • Sem CNPJ • Sem Sugargoo • Hub Ásia</div>
  </div>

  <div class="mt-6 text- text-white/20 text-center mono">Documento privado de controle interno. Não substitui documentos fiscais oficiais.</div>
</div>

<script>
function gerarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cliente = document.getElementById('cliente').value || 'Cliente';
  const produto = document.getElementById('produto').value || 'Produto';
  const id = document.getElementById('id').value || 'GS-1023';
  const peso = document.getElementById('peso').value || '0,850kg';
  const valor = document.getElementById('valor').value || 'R$ 180,00';
  const lacre = document.getElementById('lacre').value || '1023';
  const hoje = new Date().toLocaleDateString('pt-BR');
  const WHATSAPP = "+55 88 98895-2379";

  doc.setFillColor(255,255,255); doc.rect(0,0,210,297,'F');
  doc.setFillColor(8,8,8); doc.rect(0,0,210,28,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(204,255,0);
  doc.text('GABRIEL SOURCING',14,12);
  doc.setFontSize(8); doc.setTextColor(180,180,180);
  doc.text('Agente de Compras Internacional - China & Tailandia',14,18);
  doc.setFontSize(9); doc.setTextColor(204,255,0);
  doc.text('WhatsApp '+WHATSAPP,14,23);

  doc.setTextColor(0,0,0); doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.text('COMPROVANTE DE VERIFICACAO INTERNA',14,38);
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(120,120,120);
  doc.text('DOCUMENTO PRIVADO - USO INTERNO - NAO E DOCUMENTO FISCAL OFICIAL',14,42);
  doc.setFontSize(8); doc.setTextColor(0,0,0);
  doc.text('Codigo Interno: GS-QC-'+id+' | Emissao: '+hoje+' | Pedido: '+id+' | Lacre: '+lacre,14,47);
  doc.line(14,49,196,49);

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('1. DESTINATARIO',14,56);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Cliente: '+cliente,14,61); doc.text('Pedido: '+id,14,66);

  doc.setFont('helvetica','bold'); doc.text('2. OPERACAO',14,74);
  doc.setFont('helvetica','normal');
  doc.text('Origem: Shenzhen, China / Bangkok, Tailandia',14,79);
  doc.text('Centro de Inspecao: Hub de Qualidade - Asia',14,84);
  doc.text('Modal: Aereo Expresso | Peso conferido: '+peso,14,89);

  doc.setFont('helvetica','bold'); doc.text('3. PRODUTO',14,97);
  doc.setFont('helvetica','normal'); doc.text('- '+produto+' | '+valor,14,102);

  doc.setFont('helvetica','bold'); doc.text('4. LAUDO DUPLO QC',14,110);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('[OK] Inspecao fisica na China - fotos/videos conferidos',14,115);
  doc.text('[OK] Inspecao fisica no Brasil - reaberto e conferido',14,120);
  doc.text('[OK] Costura, etiqueta, tamanho, embalagem OK',14,125);
  doc.text('[OK] Lacre de seguranca n '+lacre+' aplicado',14,130);
  doc.setFont('helvetica','bold'); doc.text('Status: APROVADO E LIBERADO',14,137);

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('5. AUTENTICACAO INTERNA',14,145);
  doc.setFillColor(0,0,0); doc.rect(14,149,80,10,'F');
  doc.setTextColor(204,255,0); doc.setFontSize(8); doc.text('VERIFICADO - GABRIEL SOURCING',16,156);
  doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Codigo: GS-AUTH-'+id+'-8X92 | Lacre: '+lacre,14,166);
  doc.setFontSize(6); doc.setTextColor(100,100,100);
  doc.text('Este comprovante e de controle interno privado da Gabriel Sourcing.',14,176);
  doc.text('Nao substitui nota fiscal ou documentos oficiais da Receita. Contato: '+WHATSAPP,14,179);

  doc.save('Certificado-'+id+'-'+cliente+'.pdf');
}
</script>
</body>
</html>
