<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABRIEL SOURCING - Gerador Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.mono{font-family:JetBrains Mono,monospace}input,textarea,select{background:#1A1A1A!important}</style>
</head>
<body class="bg-[#080808] text-white min-h-screen">
<div class="max-w- mx-auto p-4 md:p-6">
  <!-- HEADER -->
  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-3"><div class="w-10 h-10 rounded- bg-[#CCFF00] text-black grid place-items-center font-black text-">G</div><div><div class="font-black text- tracking-tight">GABRIEL SOURCING</div><div class="mono text- text-white/40 tracking-widest">PREMIUM • GERADOR V2 • USO INTERNO</div></div></div>
    <div class="text-right"><div class="text- text-white/30 mono">WhatsApp</div><div class="text- font-bold text-[#CCFF00] mono">+55 88 98895-2379</div></div>
  </div>

  <div class="bg-[#121212] border border-white/[0.08] rounded- overflow-hidden">
    <div class="h- bg-gradient-to-r from-[#CCFF00] via-[#A3FF12] to-[#00FF88]"></div>
    <div class="p-6 md:p-8">
      <div class="flex justify-between items-start mb-6">
        <div><h1 class="font-black text- leading-none">DADOS DO CERTIFICADO</h1><p class="text- text-white/40 mt-2 mono">Preencha para gerar o PDF premium. Sem CNPJ, sem Sugargoo.</p></div>
        <span class="text- px-2.5 py-1 rounded-full bg-[#CCFF00]/15 border border-[#CCFF00]/30 text-[#CCFF00] font-black tracking-widest">V2 PREMIUM</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2"><label class="text- font-bold text-white/40 tracking-widest">CLIENTE *</label><input id="cliente" class="mt-1 w-full h- rounded- border border-white/10 px-4 outline-none focus:border-[#CCFF00]/60" placeholder="Ex: Luís Felipe"></div>
        <div><label class="text- font-bold text-white/40 tracking-widest">ID DO PEDIDO</label><input id="pedido" class="mt-1 w-full h- rounded- border border-white/10 px-4 mono" value="GS-1023"></div>
        <div><label class="text- font-bold text-white/40 tracking-widest">DATA EMISSÃO</label><input id="data" type="date" class="mt-1 w-full h- rounded- border border-white/10 px-4"></div>

        <div><label class="text- font-bold text-white/40 tracking-widest">PESO CONFERIDO</label><input id="peso" class="mt-1 w-full h- rounded- border border-white/10 px-4" value="0,850kg"></div>
        <div><label class="text- font-bold text-white/40 tracking-widest">LACRE Nº</label><input id="lacre" class="mt-1 w-full h- rounded- border border-white/10 px-4 mono" value="1023"></div>

        <div><label class="text- font-bold text-white/40 tracking-widest">ORIGEM</label><select id="origem" class="mt-1 w-full h- rounded- border border-white/10 px-4"><option>Shenzhen, China / Bangkok, Tailandia</option><option>Shenzhen, China</option><option>Bangkok, Tailandia</option><option>Yiwu, China</option></select></div>
        <div><label class="text- font-bold text-white/40 tracking-widest">MODAL</label><select id="modal" class="mt-1 w-full h- rounded- border border-white/10 px-4"><option>Aéreo Expresso 12-18 dias</option><option>Aéreo Econômico 18-25 dias</option><option>Marítimo Premium</option></select></div>

        <div class="md:col-span-2"><label class="text- font-bold text-white/40 tracking-widest">PRODUTOS (um por linha: QTD x Produto - Valor)</label><textarea id="produtos" rows="3" class="mt-1 w-full rounded- border border-white/10 p-4 text- outline-none focus:border-[#CCFF00]/60" placeholder="Ex:
1x Camisa Japão Edição Zoro - R$ 120
1x Bermuda Cargo - R$ 90">1x Camisa Japão Edição Zoro - R$ 120</textarea></div>

        <div><label class="text- font-bold text-white/40 tracking-widest">FRETE INTERNO ¥</label><input id="freteInt" class="mt-1 w-full h- rounded- border border-white/10 px-4" placeholder="Ex: 35"></div>
        <div><label class="text- font-bold text-white/40 tracking-widest">FRETE BR R$</label><input id="freteBR" class="mt-1 w-full h- rounded- border border-white/10 px-4" placeholder="Ex: 85"></div>
        <div class="md:col-span-2"><label class="text- font-bold text-white/40 tracking-widest">OBSERVAÇÕES (opcional)</label><input id="obs" class="mt-1 w-full h- rounded- border border-white/10 px-4" placeholder="Ex: Cliente pediu embalagem reforçada"></div>
      </div>

      <button onclick="gerarPDFPremium()" class="w-full h- mt-8 rounded- bg-[#CCFF00] text-black font-black text- tracking-wide shadow-[0_0_30px_rgba(204,255,0,0.4)] hover:shadow-[0_0_40px_rgba(204,255,0,0.6)] transition-all">📄 GERAR CERTIFICADO PREMIUM (PDF)</button>
      <div class="mt-3 flex justify-center gap-3 text- mono text-white/25"><span>• Hub Ásia</span><span>• Sem CNPJ</span><span>• Sem Sugargoo</span><span>• Duplo QC</span></div>
    </div>
  </div>
</div>

<script>
document.getElementById('data').valueAsDate = new Date();

function gerarPDFPremium(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const W = 210;
  const cliente = document.getElementById('cliente').value || 'Cliente';
  const pedido = document.getElementById('pedido').value || 'GS-1023';
  const data = document.getElementById('data').value? new Date(document.getElementById('data').value).toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');
  const peso = document.getElementById('peso').value || '0,850kg';
  const lacre = document.getElementById('lacre').value || '1023';
  const origem = document.getElementById('origem').value;
  const modal = document.getElementById('modal').value;
  const produtosRaw = document.getElementById('produtos').value || '1x Produto';
  const freteInt = document.getElementById('freteInt').value || '--';
  const freteBR = document.getElementById('freteBR').value || '--';
  const obs = document.getElementById('obs').value || '';
  const WHATSAPP = "+55 88 98895-2379";
  const auth = "GS-AUTH-"+pedido+"-"+Math.random().toString(36).substring(2,6).toUpperCase();

  // HEADER
  doc.setFillColor(8,8,8); doc.rect(0,0,W,32,'F');
  doc.setFillColor(204,255,0); doc.rect(0,30, W, 2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(204,255,0);
  doc.text('GABRIEL SOURCING', 14, 14);
  doc.setFontSize(7); doc.setTextColor(180,180,180); doc.setFont('helvetica','normal');
  doc.text('AGENTE DE COMPRAS INTERNACIONAL • HUB DE QUALIDADE - ASIA • PREMIUM SERVICE', 14, 20);
  doc.setFontSize(9); doc.setTextColor(204,255,0); doc.setFont('helvetica','bold');
  doc.text('WhatsApp '+WHATSAPP+' | ID: '+pedido+' | Lacre: '+lacre, 14, 27);

  let y = 40;
  // TITULO
  doc.setTextColor(10,10,10); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text('CERTIFICADO DE PROCEDENCIA E VERIFICACAO', 14, y);
  y+=4;
  doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(110,110,110);
  doc.text('DOCUMENTO PRIVADO DE USO INTERNO - GABRIEL SOURCING - NAO E DOCUMENTO FISCAL OFICIAL', 14, y);
  y+=4;
  doc.setFontSize(8); doc.setTextColor(0,0,0);
  doc.text('Codigo Interno: GS-QC-'+pedido+' | Emissao: '+data+' | Pedido: '+pedido+' | Lacre: '+lacre+' | Auth: '+auth, 14, y);
  y+=2; doc.setDrawColor(0,0,0); doc.line(14, y, 196, y); y+=6;

  // 1 DESTINATARIO
  doc.setFillColor(245,245,240); doc.rect(14, y-4, 182, 14, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('1. DESTINATARIO / CLIENTE', 16, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Cliente: '+cliente, 16, y); doc.text('Pedido: '+pedido, 110, y); y+=5;
  doc.text('Data Emissao: '+data+' | Status: APROVADO E LIBERADO', 16, y); y+=8;

  // 2 OPERACAO
  doc.setFillColor(245,245,240); doc.rect(14, y-4, 182, 14, 'F');
  doc.setFont('helvetica','bold'); doc.text('2. DADOS DA OPERACAO INTERNACIONAL', 16, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Origem: '+origem, 16, y); y+=4;
  doc.text('Centro de Inspecao: Hub de Qualidade - Asia (Shenzhen & Bangkok)', 16, y); y+=4;
  doc.text('Modal: '+modal+' | Peso Conferido: '+peso+' | Frete Interno: ¥ '+freteInt+' | Frete BR: R$ '+freteBR, 16, y); y+=8;

  // 3 PRODUTOS - TABELA
  doc.setFillColor(245,245,240); doc.rect(14, y-4, 182, 14, 'F');
  doc.setFont('helvetica','bold'); doc.text('3. PRODUTOS / ITENS', 16, y); y+=6;
  doc.setFillColor(8,8,8); doc.rect(14, y-4, 182, 7, 'F');
  doc.setTextColor(204,255,0); doc.setFontSize(7);
  doc.text('QTD', 16, y); doc.text('DESCRICAO', 28, y); doc.text('OBS', 140, y);
  y+=4; doc.setTextColor(0,0,0); doc.setFont('helvetica','normal');
  const linhas = produtosRaw.split('\n');
  linhas.forEach(l=>{
    if(y>255){ doc.addPage(); y=20; }
    doc.text(l.substring(0,85), 16, y); y+=4;
  });
  y+=4;

  // 4 LAUDO
  if(y>220){ doc.addPage(); y=20; }
  doc.setFillColor(245,245,240); doc.rect(14, y-4, 182, 14, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('4. LAUDO TECNICO - DUPLO QC (CHINA + BRASIL)', 16, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  const checks = [
    '[OK] Inspecao fisica na origem (China/Tailandia) - fotos e videos reais conferidos',
    '[OK] Inspecao fisica no destino (Brasil) - pacote reaberto e conferido',
    '[OK] Costura, estampa, etiqueta, tamanho e acabamento - 100% conforme',
    '[OK] Embalagem premium com plastico bolha + caixa reforçada',
    '[OK] Lacre de seguranca n '+lacre+' aplicado - inviolavel',
    '[OK] Peso dimensional conferido: '+peso
  ];
  checks.forEach(c=>{ doc.text(c, 16, y); y+=4; });
  y+=2;
  doc.setFillColor(204,255,0); doc.rect(14, y-2, 182, 8, 'F');
  doc.setFont('helvetica','bold'); doc.text('STATUS FINAL: APROVADO - LIBERADO PARA ENTREGA', 16, y+3); y+=10;

  // 5 AUTENTICACAO
  if(y>210){ doc.addPage(); y=20; }
  doc.setFillColor(245,245,240); doc.rect(14, y-4, 182, 14, 'F');
  doc.setFont('helvetica','bold'); doc.text('5. AUTENTICACAO INTERNA E RASTREABILIDADE', 16, y); y+=8;
  doc.setFillColor(8,8,8); doc.rect(14, y-2, 85, 12, 'F');
  doc.setTextColor(204,255,0); doc.setFontSize(9); doc.text('VERIFICADO - GABRIEL SOURCING', 16, y+6);
  y+=12;
  doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('Codigo Auth: '+auth, 16, y); y+=4;
  doc.text('Lacre: '+lacre+' | ID: '+pedido+' | Emissao: '+data, 16, y); y+=4;
  // QR placeholder
  doc.setDrawColor(0,0,0); doc.rect(140, y-12, 28, 28);
  doc.setFontSize(6); doc.text('QR CODE', 146, y+3); doc.text('Verificacao', 144, y+7);
  y+=20;
  if(obs){
    doc.setFont('helvetica','bold'); doc.text('OBS: '+obs, 16, y); y+=6;
  }
  doc.setFontSize(6); doc.setTextColor(110,110,110);
  doc.text('Este documento e um comprovante privado de controle interno da Gabriel Sourcing.', 14, 282);
  doc.text('Nao substitui nota fiscal, DI ou documentos oficiais. Contato: '+WHATSAPP+' - Hub Asia - Shenzhen/Bangkok > Curitiba', 14, 285);
  doc.text('Documento gerado em '+new Date().toLocaleString('pt-BR')+' - Uso exclusivo do cliente '+cliente, 14, 288);

  doc.save('Certificado-PREMIUM-'+pedido+'-'+cliente.replace(/\s+/g,'_')+'.pdf');
}
</script>
</body>
</html>
