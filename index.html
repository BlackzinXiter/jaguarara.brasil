<title>JAGUARARA V28 - DARK NEON</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,sans-serif}
.mono{font-family:"JetBrains Mono",monospace}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate-fadeIn{animation:fadeIn 0.6s ease-out forwards}
.gallery-img{user-select:none; -webkit-user-drag:none; touch-action: pinch-zoom;}
.glass-arrow{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12);
}
.glass-arrow:hover{
  background: rgba(255,255,255,0.95);
  border-color: rgba(255,255,255,0.95);
  color: #000;
  transform: translateY(-50%) scale(1.08);
}
</style>

{

<style id="dark-neon-theme">
/* BODY DARK */
body{ background:#080808 !important; color:#fff !important; }
#app{ background:#080808 !important; min-height:100vh; }

/* HEADER DARK */
header{ background:rgba(8,8,8,0.85) !important; backdrop-filter: blur(16px); border-bottom:1px solid rgba(255,255,255,0.08) !important; }
header div{ color:#fff !important; }
header .text-zinc-400{ color:rgba(255,255,255,0.4) !important; }

/* SEARCH DARK */
input#search{ background:#18181B !important; border-color:rgba(255,255,255,0.08) !important; color:#fff !important; }
input#search::placeholder{ color:rgba(255,255,255,0.35) !important; }
input#search:focus{ border-color:#CCFF00 !important; }

/* CARDS CONTAINER */
main .bg-white.rounded-\\[24px\\]{ background:#121212 !important; border-color:rgba(255,255,255,0.08) !important; }
main .bg-white.rounded-\\[24px\\] .border-b{ border-color:rgba(255,255,255,0.06) !important; }

/* LIST ITEMS */
main .hover\\:bg-\\[\\#FBFAF7\\]:hover{ background:rgba(255,255,255,0.04) !important; }
main .bg-\\[\\#F6F5F1\\]{ background:#1E1E1E !important; }
main .bg-\\[\\#F6F5F1\\].border{ border-color:rgba(255,255,255,0.06) !important; }
main .text-zinc-500{ color:rgba(255,255,255,0.5) !important; }
main .bg-\\[\\#FFF7CC\\]{ background:rgba(224,255,96,0.15) !important; border-color:rgba(224,255,96,0.3) !important; color:#CCFF00 !important; }
main .bg-\\[\\#F0EFEB\\]{ background:rgba(255,255,255,0.08) !important; }

/* DRAWER DARK */
#drawer{ background:#101010 !important; border-color:rgba(255,255,255,0.08) !important; }
#drawer .bg-\\[\\#FCFBF8\\]{ background:#101010 !important; }
#drawer .bg-white{ background:#18181B !important; border-color:rgba(255,255,255,0.08) !important; }
#drawer .bg-white input{ color:#fff !important; }
#drawer .bg-\\[\\#F6F5F1\\]{ background:#1E1E1E !important; border-color:rgba(255,255,255,0.08) !important; color:#fff !important; }
#drawer .bg-\\[\\#FBFAF7\\]{ background:#1E1E1E !important; border-color:rgba(255,255,255,0.08) !important; color:#fff !important; }
#drawer .bg-\\[\\#FFFBEB\\]{ background:rgba(255,255,255,0.05) !important; }

/* BUTTONS NEON */
button.bg-black, button.bg-\\[\\#004A2D\\]{ background:#CCFF00 !important; color:#080808 !important; font-weight:800 !important; box-shadow:0 0 20px rgba(224,255,96,0.3) !important; }
button.bg-black:hover{ background:#D4FF33 !important; box-shadow:0 0 30px rgba(224,255,96,0.5) !important; }

/* PROGRESS BAR NEON */
.h-full.bg-black{ background:#CCFF00 !important; box-shadow:0 0 10px rgba(224,255,96,0.6) !important; }

/* NEW ORDER MODAL */
#newModal .bg-white{ background:#141414 !important; border-color:rgba(255,255,255,0.08) !important; }
#newModal .bg-\\[\\#FBFAF7\\]{ background:#1E1E1E !important; }
#newModal input{ background:#1E1E1E !important; color:#fff !important; border-color:rgba(255,255,255,0.08) !important; }
#newModal .bg-\\[\\#F6F5F1\\]{ background:#1E1E1E !important; }

/* SELECT STATUS */
#selStatus{ background:#CCFF00 !important; color:#000 !important; font-weight:900 !important; }

/* TOAST NEON */
#toast{ background:#CCFF00 !important; color:#000 !important; font-weight:800 !important; box-shadow:0 0 30px rgba(224,255,96,0.5) !important; }

/* BADGES */
span.bg-black{ background:#FFFFFF !important; color:#000 !important; }
span.bg-\\[\\#FFF7CC\\]{ background:rgba(224,255,96,0.2) !important; color:#CCFF00 !important; border:1px solid rgba(224,255,96,0.3) !important; }

/* Gradient top neon */
.h-\\[4px\\].bg-gradient-to-r{ background: linear-gradient(90deg, #CCFF00 0%, #00FF88 100%) !important; }

/* Scrollbar dark */
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(224,255,96,0.5); }

/* Gallery stays dark already */
#galleryModal{ background:#050505 !important; }
</style>

function compressImage(file, maxW=800, quality=0.55){
return new Promise((resolve,reject)=>{
  let reader=new FileReader();
  reader.onload=e=>{
    let img=new Image();
    img.onload=()=>{
      let canvas=document.createElement("canvas");
      let w=img.width, h=img.height;
      if(w>maxW){h=(maxW/w)*h; w=maxW;}
      if(h>maxW){w=(maxW/h)*w; h=maxW;}
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror=reject;
    img.src=e.target.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
});
}

function openGallery(index){

  document.getElementById("galleryModal").classList.add("hidden");

function updateGallery(){
  if(galleryPhotos.length===0) return;
  document.getElementById("galleryImg").src=galleryPhotos[galleryIndex];
  let num = String(galleryIndex+1).padStart(2,'0');
  let total = String(galleryPhotos.length).padStart(2,'0');
  document.getElementById("galleryCounterTop").textContent=num;
  document.getElementById("galleryTotalTop").textContent=total;
  document.getElementById("galleryCounterMobile").textContent=\`\${galleryIndex+1} / \${galleryPhotos.length}\`;
  let thumbs=document.getElementById("galleryThumbs");
  thumbs.innerHTML=galleryPhotos.map((f,i)=>\`
    <div onclick="goToPhoto(\${i})" class="relative w-[72px] h-[72px] rounded-[14px] overflow-hidden cursor-pointer flex-shrink-0 transition-all duration-400 \${i===galleryIndex?'ring-2 ring-[#CCFF00] ring-offset-2 ring-offset-[#0A0A0A] scale-[1.08] opacity-100 shadow-[0_0_20px_rgba(204,255,0,0.5)] border-2 border-[#CCFF00]':'opacity-60 hover:opacity-100 border-2 border-white/10 hover:border-[#CCFF00]/50'}">
      <img src="\${f}" class="w-full h-full object-cover">
      \${i===galleryIndex?'<div class="absolute inset-0 bg-[#CCFF00]/10 pointer-events-none"></div>':''} 
    </div>\`).join("");
  document.getElementById("galleryDateInfo").textContent = galleryPhotosDates ? \`Fotos adicionadas em \${galleryPhotosDates}\` : '';
}
function nextPhoto(){ galleryIndex=(galleryIndex+1)%galleryPhotos.length; updateGallery(); }
function prevPhoto(){ galleryIndex=(galleryIndex-1+galleryPhotos.length)%galleryPhotos.length; updateGallery(); }
function goToPhoto(i){ galleryIndex=i; updateGallery(); }

document.addEventListener("keydown",(e)=>{
  let modal=document.getElementById("galleryModal");
  if(modal.classList.contains("hidden")) return;
  if(e.key==="ArrowRight") nextPhoto();
  if(e.key==="ArrowLeft") prevPhoto();
  if(e.key==="Escape") closeGallery();
});

window.changeStatus=async(val)=>{
  let o=orders.find(x=>x.id===sel); if(!o) return;
  let dataHora = nowBR();
  let newIdx = STEPS.findIndex(s=>s.id===val);
  let oldIdx = STEPS.findIndex(s=>s.id===o.status);
  let newHistory = {...(o.statusHistory||{})};
  
  if(newIdx < oldIdx){
    // VOLTOU STATUS: apaga tudo que for futuro
    STEPS.forEach((s,i)=>{
      if(i > newIdx){
        delete newHistory[s.id];
      }
    });
    newHistory[val] = dataHora;
    toast(\`Voltou para \${val} • Futuro apagado • \${dataHora}\`);
  } else {
    // AVANÇOU: só salva se for pra frente
    newHistory[val] = dataHora;
    toast(\`Avançou para \${val} em \${dataHora}\`);
  }
  
  try{
    await updateDoc(doc(db,"pedidos",o.id), {status:val, statusHistory: newHistory});
  }catch(e){ toast("Erro: "+e.message); }
};
